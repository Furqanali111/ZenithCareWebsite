# When a PR changes the text of an existing post and leaves its "Last updated" date alone, set the date to today.
# A change to only the SEO title or description does not count. Never runs on forks and never pushes to develop.
# Skips a person's own feature/content-<login> or feature/seo-edits-<login>: publish-content.yml runs the same script there.
name: Post dates

on:
  pull_request:
    paths:
      - "web/content/posts/**"

permissions:
  contents: write

jobs:
  dates:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.head_ref != format('feature/content-{0}', github.event.pull_request.user.login)
      && github.head_ref != format('feature/seo-edits-{0}', github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update the date of edited posts
        working-directory: web
        env:
          BASE: ${{ github.base_ref }}
        run: node --experimental-strip-types --no-warnings scripts/bump-updated.mjs "origin/$BASE"
      - name: Commit the dates
        run: |
          if git diff --quiet -- web/content/posts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/content/posts
          git commit -m "fix(content): update the last updated date of edited posts"
          git pull --rebase origin "${{ github.event.pull_request.head.ref }}"
          git push
