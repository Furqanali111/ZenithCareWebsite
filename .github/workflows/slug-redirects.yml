# When a PR renames a post (its URL slug changed), add the 301 redirect to
# web/content/redirects.json on the same PR branch, so the old link keeps working.
# Deleted posts only get a warning. Never runs on forks and never pushes to develop.
name: Slug redirects

on:
  pull_request:
    paths:
      - "web/content/posts/**"

permissions:
  contents: write

jobs:
  redirects:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add redirects for renamed posts
        working-directory: web
        env:
          BASE: ${{ github.base_ref }}
        run: node --experimental-strip-types --no-warnings scripts/slug-redirects.mjs "origin/$BASE"
      - name: Commit the redirects
        run: |
          if git diff --quiet -- web/content/redirects.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/content/redirects.json
          git commit -m "fix(seo): add 301 redirects for renamed posts"
          git push
